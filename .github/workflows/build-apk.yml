name: Build APK

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # ── Debug build — always produces a downloadable APK ─────────────────────────
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
             artifacts/LinkedInAutomator-debug-${SHORT_SHA}.apk
          echo "Built: $(ls -lh artifacts/)"

      # ── DOWNLOAD HERE ──────────────────────────────────────────────────────────
      # Go to: Actions tab → this workflow run → scroll to bottom → Artifacts section
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LinkedInAutomator-DEBUG
          path: artifacts/LinkedInAutomator-debug-*.apk
          retention-days: 30

  # ── Release build — signed with debug key (installable, not Play Store ready) ─
  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: build-debug          # only run if debug succeeded

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          mkdir -p artifacts
          find app/build/outputs/apk/release/ -name "*.apk" | head -1 | \
            xargs -I{} cp {} artifacts/LinkedInAutomator-release-${SHORT_SHA}.apk
          echo "Built: $(ls -lh artifacts/)"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: LinkedInAutomator-RELEASE
          path: artifacts/LinkedInAutomator-release-*.apk
          retention-days: 30
