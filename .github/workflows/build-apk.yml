name: Build APK

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:   # allows manual trigger from GitHub UI

jobs:
  build:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK (debug-signed for CI)
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APKs with version info
        run: |
          VERSION_NAME=$(./gradlew -q printVersionName 2>/dev/null || echo "1.0")
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
             artifacts/LinkedInAutomator-debug-${SHORT_SHA}.apk
          cp app/build/outputs/apk/release/app-release*.apk \
             artifacts/LinkedInAutomator-release-${SHORT_SHA}.apk 2>/dev/null || \
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
             artifacts/LinkedInAutomator-release-${SHORT_SHA}.apk 2>/dev/null || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LinkedInAutomator-debug-${{ github.sha }}
          path: artifacts/LinkedInAutomator-debug-*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: LinkedInAutomator-release-${{ github.sha }}
          path: artifacts/LinkedInAutomator-release-*.apk
          retention-days: 30

      - name: Print APK info
        run: |
          echo "=== Build Summary ==="
          ls -lh artifacts/
          echo "APKs are available in the Actions tab → this run → Artifacts"
